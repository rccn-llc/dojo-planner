name: Bug Report
description: Report a defect or unexpected behavior in Dojo Planner
title: '[Bug] '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out as much detail as possible to help us reproduce and fix the issue quickly.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the application is affected?
      options:
        - Members
        - Classes & Schedules
        - Programs
        - Memberships & Plans
        - Billing & Payments
        - Waivers
        - Staff & Roles
        - Dashboard & Reports
        - Catalog
        - Marketing & Coupons
        - Authentication & Onboarding
        - Settings
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is the impact?
      options:
        - 'Critical — Data loss, security issue, or system unusable'
        - 'High — Core feature is broken, no workaround'
        - 'Medium — Feature partially broken, workaround exists'
        - Low — Cosmetic issue or minor inconvenience
    validations:
      required: true

  - type: checkboxes
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter this bug? (Check all that apply)
      options:
        - label: Production
        - label: Preview / Staging
        - label: Local development

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      description: 'e.g. Chrome 124 / macOS 14.4, Firefox 125 / Windows 11'
      placeholder: Chrome 124 / macOS 14
    validations:
      required: true

  - type: input
    id: role
    attributes:
      label: User Role
      description: What Dojo Planner role were you logged in as when the bug occurred?
      placeholder: 'e.g. Admin, Academy Owner, Front Desk, Member'

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what went wrong.
      placeholder: "When I click 'Add Member', the form submits but the member never appears in the list..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide numbered steps so we can reliably reproduce the issue.
      placeholder: |
        1. Go to Dashboard → Members
        2. Click 'Add Member'
        3. Fill in all required fields and click 'Next'
        4. ...
        5. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "The new member should appear in the members list with status 'Active'."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: The wizard closes but the member does not appear. Refreshing the page shows no new member was created.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recordings
      description: |
        Drag and drop screenshots or a screen recording here. Visual evidence dramatically speeds up debugging.
        Tip: use Cmd+Shift+5 (macOS) or Win+Shift+S (Windows) for quick screenshots.
      placeholder: Drag screenshots or a .mp4/.gif here...

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: |
        Open DevTools (F12 → Console tab), reproduce the bug, then paste any red errors here.
      render: text
      placeholder: |
        TypeError: Cannot read properties of undefined (reading 'id')
            at AddMemberModal.tsx:42

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else that might help — related issues, data conditions, frequency (always/sometimes/once), etc.
      placeholder: This only happens when adding a family member whose HOH has no payment method on file.
