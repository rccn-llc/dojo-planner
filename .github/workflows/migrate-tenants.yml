name: Migrate tenants

# Applies pending migrations to the control plane, the shared database, and
# every ACTIVE tenant database, then verifies no tenant is left behind.
#
# ── Why this workflow exists ─────────────────────────────────────────────────
#
# `src/scripts/migrateTenants.ts` was written to run "in the deploy pipeline
# BEFORE the new version serves traffic" but nothing ever invoked it:
# `vercel.json` has no buildCommand, `npm run build` is a bare `next build`,
# and no workflow referenced it. A deploy that added a column therefore shipped
# code to production before any tenant database had that column, and the first
# query against it failed at runtime.
#
# ── Why not a Vercel buildCommand ────────────────────────────────────────────
#
# Vercel builds run per-deployment and concurrently, including for every
# preview. Migrating from there would race N builds against the same databases
# and would run DDL on preview deploys. A single serialized workflow is the
# correct place. (`migrateOne` also takes a pg advisory lock per database, so
# two overlapping runs refuse rather than corrupt — belt and braces.)

on:
  # Manual: the safe default. Run this, confirm it is green, then promote.
  workflow_dispatch:
    inputs:
      dry-run:
        description: List targets without applying migrations
        type: boolean
        default: false
  # Automatic on main, but only when the schema actually changed.
  push:
    branches: [main]
    paths:
      - migrations/**
      - src/models/Schema.ts
      - src/models/ControlSchema.ts

# Never let two migration runs overlap. `cancel-in-progress: false` because a
# half-finished migration must be allowed to finish rather than be killed.
concurrency:
  group: migrate-tenants
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to every tenant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x

      # Catches a Schema.ts / baseline divergence BEFORE any DDL runs. Cheap,
      # and a mismatch here means the migration itself is suspect.
      - name: Verify Schema.ts and the baseline agree
        run: npm run db:check-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply migrations
        run: npm run db:migrate:tenants -- ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTROL_DATABASE_URL: ${{ secrets.CONTROL_DATABASE_URL }}
          CONTROL_PLANE_ENCRYPTION_KEY: ${{ secrets.CONTROL_PLANE_ENCRYPTION_KEY }}
          IQPRO_CONFIG_ENCRYPTION_KEY: ${{ secrets.IQPRO_CONFIG_ENCRYPTION_KEY }}

      # The migrator exits non-zero on failure, but a tenant can also drift by
      # never having been migrated at all (a row added while this ran, a
      # decryption failure the migrator deliberately skips). This is the check
      # that says so out loud.
      - name: Verify no tenant is left behind
        if: ${{ !inputs.dry-run }}
        run: npm run db:check-tenants
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTROL_DATABASE_URL: ${{ secrets.CONTROL_DATABASE_URL }}
          CONTROL_PLANE_ENCRYPTION_KEY: ${{ secrets.CONTROL_PLANE_ENCRYPTION_KEY }}
          IQPRO_CONFIG_ENCRYPTION_KEY: ${{ secrets.IQPRO_CONFIG_ENCRYPTION_KEY }}
